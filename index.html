<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BappaThota Homestay</title>

<meta name="theme-color" content="#2980b9">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:
    linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
    url("https://raw.githubusercontent.com/bappathota/Homestay/main/Image.jpeg");
  background-size:cover;
}
h1{color:#fff;text-align:center;margin:20px 0}

.container{
  background:#fff;
  max-width:960px;
  margin:auto;
  padding:20px;
  border-radius:14px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}
.primary{background:#2980b9;color:#fff}
.success{background:#27ae60;color:#fff}
.warn{background:#e74c3c;color:#fff}
.edit{background:#f39c12;color:#fff}

.hidden{display:none}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}
.booked{color:red;font-weight:600}
.available{color:green;font-weight:600}

/* MODALS */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:380px;
}
.modal h3{margin-top:0}
.modal label{font-size:13px;font-weight:600}
.modal input, .modal select{
  width:100%;
  padding:10px;
  margin:6px 0 12px;
}
.modal-actions{
  display:flex;
  gap:10px;
}

.calendar-day{
  border:1px solid #ddd;
  border-radius:8px;
  padding:6px;
  font-size:12px;
}
.calendar-day.booked{background:#fdecea}
.calendar-day.available{background:#eafaf1}
.calendar-date{font-weight:700}
</style>
</head>

<body>

<h1>BappaThota Homestay</h1>

<div class="container">

<button id="adminLoginBtn" class="primary">🔐 Admin Login</button>
<button id="addBookingBtn" class="primary hidden">➕ Add Booking</button>
<button id="calendarBtn" class="primary">📅 Calendar</button>

<!-- TABLE -->
<h3>Today's Availability</h3>
<table>
<thead>
<tr>
<th>Room</th>
<th>Status</th>
<th>Guest</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<!-- CALENDAR -->
<div id="calendarWrapper" class="hidden">
  <h3 id="monthLabel"></h3>
  <button onclick="changeMonth(-1)">⬅</button>
  <button onclick="changeMonth(1)">➡</button>
  <div id="calendar"
       style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px">
  </div>
</div>

</div>

<!-- ADMIN LOGIN -->
<div id="adminModal" class="modal-overlay">
  <div class="modal">
    <h3>Admin Login</h3>
    <label>PIN</label>
    <input id="adminPin" type="password" maxlength="4">
    <div id="adminError" style="color:red;font-size:13px"></div>
    <div class="modal-actions">
      <button class="warn" onclick="closeAdmin()">Cancel</button>
      <button class="success" onclick="verifyAdmin()">Login</button>
    </div>
  </div>
</div>

<!-- ADD BOOKING -->
<div id="addModal" class="modal-overlay">
  <div class="modal">
    <h3>Add Booking</h3>

    <label>Guest Name</label>
    <input id="guest">

    <label>Phone (10 digits)</label>
    <input id="phone">

    <label>No. of Guests (max 4)</label>
    <input id="guests" type="number" min="1" max="4">

    <label>Room</label>
    <select id="room"></select>

    <label>Check-in</label>
    <input type="date" id="checkin">

    <label>Check-out</label>
    <input type="date" id="checkout">

    <div class="modal-actions">
      <button class="warn" onclick="closeAdd()">Cancel</button>
      <button class="success" onclick="addBooking()">Confirm</button>
    </div>
  </div>
</div>

<!-- VIEW -->
<div id="viewModal" class="modal-overlay">
  <div class="modal">
    <h3>Booking Details</h3>
    <div id="viewBody"></div>
    <button onclick="closeView()">Close</button>
  </div>
</div>

<!-- EDIT -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h3>Edit Booking</h3>
    <input id="editGuest">
    <input id="editPhone">
    <input id="editGuests" type="number">
    <input id="editCheckin" type="date">
    <input id="editCheckout" type="date">
    <div class="modal-actions">
      <button class="warn" onclick="closeEdit()">Cancel</button>
      <button class="success" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- CANCEL -->
<div id="cancelModal" class="modal-overlay">
  <div class="modal">
    <h3>Cancel Booking?</h3>
    <div class="modal-actions">
      <button onclick="closeCancel()">No</button>
      <button class="warn" onclick="confirmCancel()">Yes</button>
    </div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyNAx2Tuc3tn2pLg3OVBJ2Cu5iRPn7EnQ-QrscSUC1JQ9s6hgpTecJiZQuS4M3TYRCJ3g/exec";
const TOTAL_ROOMS=2;

let admin=false, editData=null, cancelId=null;
const $=id=>document.getElementById(id);
const dOnly=d=>new Date(d).toISOString().split("T")[0];

/* ADMIN */
$("adminLoginBtn").onclick=()=>$("adminModal").classList.add("show");
function closeAdmin(){$("adminModal").classList.remove("show")}
function verifyAdmin(){
  fetch(`${API_URL}?action=verifyAdmin&pin=${$("adminPin").value}`)
  .then(r=>r.json()).then(res=>{
    if(!res.success){$("adminError").textContent="Invalid PIN";return;}
    admin=true;
    $("adminLoginBtn").classList.add("hidden");
    $("addBookingBtn").classList.remove("hidden");
    closeAdmin(); loadToday();
  });
}

/* INIT */
function initRooms(){
  $("room").innerHTML="";
  for(let i=1;i<=TOTAL_ROOMS;i++)
    $("room").innerHTML+=`<option value="${i}">Room ${i}</option>`;
}

/* ADD */
$("addBookingBtn").onclick=()=>$("addModal").classList.add("show");
function closeAdd(){$("addModal").classList.remove("show")}

async function addBooking(){
  if(!/^\d{10}$/.test($("phone").value)) return alert("Invalid phone");
  if($("guests").value>4) return alert("Max 4 guests");

  const data=await fetch(API_URL).then(r=>r.json());
  const overlap=data.find(b=>
    b.room_no==$("room").value &&
    $("checkin").value<=dOnly(b.check_out) &&
    $("checkout").value>=dOnly(b.check_in)
  );
  if(overlap) return alert("Room already booked for these dates");

  await fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"add",
      guest_name:$("guest").value,
      phone:$("phone").value,
      no_of_guests:$("guests").value,
      room_no:$("room").value,
      check_in:$("checkin").value,
      check_out:$("checkout").value
    })
  });

  closeAdd(); loadToday();
}

/* LOAD */
async function loadAvailability(date){
  const data=await fetch(API_URL).then(r=>r.json());
  $("list").innerHTML="";
  for(let i=1;i<=TOTAL_ROOMS;i++){
    const b=data.find(x=>x.room_no==i && date>=dOnly(x.check_in) && date<=dOnly(x.check_out));
    let act="-";
    if(b){
      act=`<button onclick="viewBooking('${b.booking_id}')">View</button>`;
      if(admin){
        act+=` <button class="edit" onclick="editBooking('${b.booking_id}')">Edit</button>
               <button class="warn" onclick="openCancel('${b.booking_id}')">Cancel</button>`;
      }
    }
    $("list").innerHTML+=`
    <tr>
      <td>Room ${i}</td>
      <td class="${b?'booked':'available'}">${b?'Booked':'Available'}</td>
      <td>${b?.guest_name||'-'}</td>
      <td>${act}</td>
    </tr>`;
  }
}
function loadToday(){loadAvailability(dOnly(new Date()));}

/* VIEW */
function viewBooking(id){
  fetch(API_URL).then(r=>r.json()).then(data=>{
    const b=data.find(x=>x.booking_id===id);
    $("viewBody").innerHTML=`
    <b>Guest:</b> ${b.guest_name}<br>
    <b>Phone:</b> ${b.phone}<br>
    <b>Guests:</b> ${b.no_of_guests}<br>
    <b>Room:</b> ${b.room_no}<br>
    <b>Check-in:</b> ${dOnly(b.check_in)}<br>
    <b>Check-out:</b> ${dOnly(b.check_out)}`;
    $("viewModal").classList.add("show");
  });
}
function closeView(){$("viewModal").classList.remove("show")}

/* EDIT */
function editBooking(id){
  fetch(API_URL).then(r=>r.json()).then(data=>{
    editData=data.find(x=>x.booking_id===id);
    $("editGuest").value=editData.guest_name;
    $("editPhone").value=editData.phone;
    $("editGuests").value=editData.no_of_guests;
    $("editCheckin").value=dOnly(editData.check_in);
    $("editCheckout").value=dOnly(editData.check_out);
    $("editModal").classList.add("show");
  });
}
function closeEdit(){$("editModal").classList.remove("show")}
function saveEdit(){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({
      action:"update",
      booking_id:editData.booking_id,
      guest_name:$("editGuest").value,
      phone:$("editPhone").value,
      no_of_guests:$("editGuests").value,
      room_no:editData.room_no,
      check_in:$("editCheckin").value,
      check_out:$("editCheckout").value
    })
  }).then(()=>{closeEdit();loadToday();});
}

/* CANCEL */
function openCancel(id){cancelId=id;$("cancelModal").classList.add("show")}
function closeCancel(){$("cancelModal").classList.remove("show")}
function confirmCancel(){
  fetch(API_URL,{
    method:"POST",
    body:new URLSearchParams({action:"cancel",booking_id:cancelId})
  }).then(()=>{closeCancel();loadToday();});
}

/* CALENDAR */
let cm=new Date().getMonth(), cy=new Date().getFullYear();
$("calendarBtn").onclick=()=>{$("calendarWrapper").classList.toggle("hidden");renderCalendar();}
function changeMonth(d){cm+=d;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}renderCalendar()}
async function renderCalendar(){
  $("calendar").innerHTML="";
  $("monthLabel").textContent=new Date(cy,cm).toLocaleString("default",{month:"long",year:"numeric"});
  const data=await fetch(API_URL).then(r=>r.json());
  const days=new Date(cy,cm+1,0).getDate();
  for(let d=1;d<=days;d++){
    const date=`${cy}-${String(cm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let html="";
    for(let r=1;r<=TOTAL_ROOMS;r++){
      const b=data.find(x=>x.room_no==r && date>=dOnly(x.check_in) && date<=dOnly(x.check_out));
      html+=`Room ${r}: ${b?'❌':'✅'}<br>`;
    }
    $("calendar").innerHTML += `
  <div class="calendar-day ${html.includes('❌') ? 'booked' : 'available'}"
       onclick="selectCalendarDate('${date}')"
       style="cursor:pointer">
       
    <div class="calendar-date">${d}</div>
    ${html}
  </div>
`;

  }
}
function selectCalendarDate(date) {
  // Close calendar
  document.getElementById("calendarWrapper").classList.add("hidden");

  // Load availability for clicked date
  loadAvailability(date);

  // Update title
  document.querySelector("h3").textContent =
    "Availability on " + date;
}


/* START */
document.addEventListener("DOMContentLoaded",()=>{
  initRooms();
  loadToday();
});
</script>

</body>
</html>
