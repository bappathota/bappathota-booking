<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BappaThota Homestay</title>

<meta name="theme-color" content="#2980b9">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
  url("https://raw.githubusercontent.com/bappathota/Homestay/main/Image.jpeg");
  background-size:cover;
}

h1{color:#fff;text-align:center;margin:20px 0}

.container{
  background:#fff;
  max-width:960px;
  margin:auto;
  padding:20px;
  border-radius:14px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.primary{background:#2980b9;color:#fff}
.success{background:#27ae60;color:#fff}
.warn{background:#e74c3c;color:#fff}
.edit{background:#f39c12;color:#fff}

.hidden{display:none}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}
.booked{color:red;font-weight:600}
.available{color:green;font-weight:600}

/* MODALS */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-overlay.show{display:flex}

.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:420px;
}

.modal h3{margin-top:0}

.modal label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-top:10px;
}

.modal input, .modal select{
  width:100%;
  padding:10px;
  margin-top:4px;
}

.modal-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}

@media(max-width:600px){
  table{font-size:13px}
}
</style>
</head>

<body>

<h1>BappaThota Homestay</h1>

<div class="container">

<button id="adminLoginBtn" class="primary">🔐 Admin Login</button>
<button id="addBookingBtn" class="primary hidden">➕ Add Booking</button>
<button id="calendarBtn" class="primary">📅 Calendar</button>

<h3>Today's Availability</h3>

<table>
<thead>
<tr>
<th>Room</th>
<th>Status</th>
<th>Guest</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<div id="calendarWrapper" class="hidden">
  <h3 id="monthLabel"></h3>
  <button onclick="changeMonth(-1)">⬅</button>
  <button onclick="changeMonth(1)">➡</button>
  <div id="calendar" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px"></div>
</div>

</div>

<!-- ADMIN LOGIN -->
<div id="adminModal" class="modal-overlay">
  <div class="modal">
    <h3>Admin Login</h3>
    <label>4 Digit PIN</label>
    <input id="adminPin" type="password" maxlength="4">
    <div id="adminError" style="color:red"></div>
    <div class="modal-actions">
      <button class="warn" onclick="closeAdmin()">Cancel</button>
      <button class="success" onclick="verifyAdmin()">Login</button>
    </div>
  </div>
</div>

<!-- ADD BOOKING -->
<div id="addModal" class="modal-overlay">
  <div class="modal">
    <h3>Add Booking</h3>

    <label>Guest Name</label>
    <input id="guest">

    <label>Phone (10 digits)</label>
    <input id="phone">

    <label>No. of Guests (max 4)</label>
    <input id="guests" type="number" min="1" max="4">

    <label>Room</label>
    <select id="room"></select>

    <label>Check-in</label>
    <input type="date" id="checkin">

    <label>Check-out</label>
    <input type="date" id="checkout">

    <div class="modal-actions">
      <button class="warn" onclick="closeAdd()">Cancel</button>
      <button class="success" onclick="addBooking()">Confirm</button>
    </div>
  </div>
</div>

<!-- INVOICE -->
<div id="invoiceModal" class="modal-overlay">
  <div class="modal">
    <h3>Invoice</h3>

    <p><strong>Guest:</strong> <span id="invGuest"></span></p>
    <p><strong>Room:</strong> <span id="invRoom"></span></p>
    <p><strong>Nights:</strong> <span id="invNights"></span></p>

    <label>Cost per night (₹)</label>
    <input id="invRate" type="number">

    <label>Extra charges (₹)</label>
    <input id="invExtra" type="number" value="0">

    <h3>Total: ₹ <span id="invTotal">0</span></h3>

    <div class="modal-actions">
      <button class="warn" onclick="closeInvoice()">Close</button>
      <button class="success" onclick="window.print()">Print</button>
    </div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyNAx2Tuc3tn2pLg3OVBJ2Cu5iRPn7EnQ-QrscSUC1JQ9s6hgpTecJiZQuS4M3TYRCJ3g/exec";
const TOTAL_ROOMS=2;

let admin=false;
let allData=[];
let invoiceData=null;

const $=id=>document.getElementById(id);
const toDate=d=>new Date(d).toISOString().split("T")[0];

/* ADMIN */
$("adminLoginBtn").onclick=()=>$("adminModal").classList.add("show");
function closeAdmin(){$("adminModal").classList.remove("show")}
function verifyAdmin(){
  fetch(`${API_URL}?action=verifyAdmin&pin=${$("adminPin").value}`)
  .then(r=>r.json())
  .then(res=>{
    if(!res.success){$("adminError").textContent="Invalid PIN";return;}
    admin=true;
    $("adminLoginBtn").classList.add("hidden");
    $("addBookingBtn").classList.remove("hidden");
    closeAdmin();
    loadToday();
  });
}

/* INIT */
function initRooms(){
  for(let i=1;i<=TOTAL_ROOMS;i++)
    $("room").innerHTML+=`<option>${i}</option>`;
}

/* ADD BOOKING */
$("addBookingBtn").onclick=()=>$("addModal").classList.add("show");
function closeAdd(){$("addModal").classList.remove("show")}

async function addBooking(){
  if(!/^\d{10}$/.test($("phone").value)) return alert("Invalid phone");
  if($("guests").value>4) return alert("Max 4 guests");

  const ci=$("checkin").value, co=$("checkout").value, rm=$("room").value;

  if(allData.some(b=>b.room_no==rm && ci<=toDate(b.check_out) && co>=toDate(b.check_in)))
    return alert("Room already booked for these dates");

  const fd=new URLSearchParams({
    action:"add",
    guest_name:$("guest").value,
    phone:$("phone").value,
    no_of_guests:$("guests").value,
    room_no:rm,
    check_in:ci,
    check_out:co
  });

  const res=await fetch(API_URL,{method:"POST",body:fd});
  const r=await res.json();
  if(!r.success) return alert(r.message);

  closeAdd();
  loadToday();
}

/* LOAD */
async function loadAvailability(date){
  allData=await fetch(API_URL).then(r=>r.json());
  $("list").innerHTML="";
  for(let i=1;i<=TOTAL_ROOMS;i++){
    const b=allData.find(x=>x.room_no==i && date>=toDate(x.check_in) && date<=toDate(x.check_out));
    let act=b?`<button onclick="openInvoice('${b.booking_id}')">Invoice</button>`:"-";
    $("list").innerHTML+=`
    <tr>
      <td>Room ${i}</td>
      <td class="${b?'booked':'available'}">${b?'Booked':'Available'}</td>
      <td>${b?.guest_name||'-'}</td>
      <td>${act}</td>
    </tr>`;
  }
}
function loadToday(){loadAvailability(toDate(new Date()))}

/* INVOICE */
function openInvoice(id){
  invoiceData=allData.find(b=>b.booking_id===id);
  const nights=(new Date(invoiceData.check_out)-new Date(invoiceData.check_in))/(86400000);
  $("invGuest").textContent=invoiceData.guest_name;
  $("invRoom").textContent="Room "+invoiceData.room_no;
  $("invNights").textContent=nights;
  $("invRate").value="";
  $("invExtra").value=0;
  $("invTotal").textContent=0;
  $("invoiceModal").classList.add("show");

  $("invRate").oninput=calc;
  $("invExtra").oninput=calc;

  function calc(){
    $("invTotal").textContent=(Number($("invRate").value||0)*nights)+Number($("invExtra").value||0);
  }
}
function closeInvoice(){$("invoiceModal").classList.remove("show")}

/* CALENDAR */
let cm=new Date().getMonth(),cy=new Date().getFullYear();
$("calendarBtn").onclick=()=>{$("calendarWrapper").classList.toggle("hidden");renderCalendar()}
function changeMonth(d){cm+=d;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}renderCalendar()}
async function renderCalendar(){
  $("calendar").innerHTML="";
  $("monthLabel").textContent=new Date(cy,cm).toLocaleString("default",{month:"long",year:"numeric"});
  const data=await fetch(API_URL).then(r=>r.json());
  const days=new Date(cy,cm+1,0).getDate();
  for(let d=1;d<=days;d++){
    const date=`${cy}-${String(cm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let html="";
    for(let r=1;r<=TOTAL_ROOMS;r++){
      const b=data.find(x=>x.room_no==r && date>=toDate(x.check_in)&&date<=toDate(x.check_out));
      html+=`Room ${r}: ${b?'❌':'✅'}<br>`;
    }
    $("calendar").innerHTML+=`<div style="border:1px solid #ccc;padding:6px">${d}<br>${html}</div>`;
  }
}

/* START */
document.addEventListener("DOMContentLoaded",()=>{
  initRooms();
  loadToday();
});
</script>

</body>
</html>
