<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BappaThota Homestay</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
  url("https://raw.githubusercontent.com/bappathota/Homestay/main/Image.jpeg");
  background-size:cover;
}
h1{color:#fff;text-align:center;margin:20px 0}

.container{
  background:#fff;
  max-width:1000px;
  margin:auto;
  padding:20px;
  border-radius:14px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:600;
  margin:2px;
}
.primary{background:#2980b9;color:#fff}
.success{background:#27ae60;color:#fff}
.warn{background:#e74c3c;color:#fff}
.edit{background:#f39c12;color:#fff}

.hidden{display:none}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  padding:10px;
  border:1px solid #ddd;
  text-align:center;
}
.booked{color:#c0392b;font-weight:600}
.available{color:#27ae60;font-weight:600}

/* Calendar */
.calendar-day{
  background:#f8f9fa;
  border-radius:8px;
  padding:6px;
  min-height:90px;
  font-size:12px;
  border:1px solid #ddd;
}
.calendar-day.booked{background:#fdecea;}
.calendar-day.available{background:#eafaf1;}
.calendar-date{font-weight:700;margin-bottom:4px}

/* MODALS */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.modal-overlay.show{display:flex}
.modal{
  background:#fff;
  padding:20px;
  border-radius:14px;
  width:95%;
  max-width:420px;
}
.modal label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-top:10px;
}
.modal input, .modal select{
  width:100%;
  padding:8px;
  margin-top:4px;
}
.modal-actions{
  display:flex;
  gap:10px;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>BappaThota Homestay</h1>

<div class="container">

<button id="adminLoginBtn" class="primary">🔐 Admin Login</button>
<button id="addBookingBtn" class="primary hidden">➕ Add Booking</button>
<button id="calendarBtn" class="primary">📅 Calendar</button>

<h3>Today's Availability</h3>

<table>
<thead>
<tr>
<th>Room</th>
<th>Status</th>
<th>Guest</th>
<th>Action</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<!-- Calendar -->
<div id="calendarWrapper" class="hidden">
  <h3 id="monthLabel" style="text-align:center"></h3>
  <div style="display:flex;justify-content:space-between;margin-bottom:10px">
    <button onclick="changeMonth(-1)">⬅ Prev</button>
    <button onclick="changeMonth(1)">Next ➡</button>
  </div>
  <div id="calendar" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;"></div>
</div>

</div>

<!-- ADMIN MODAL -->
<div id="adminModal" class="modal-overlay">
  <div class="modal">
    <h3>Admin Login</h3>
    <label>4-digit PIN</label>
    <input id="adminPin" type="password" maxlength="4">
    <div id="adminError" style="color:red"></div>
    <div class="modal-actions">
      <button class="warn" onclick="closeAdmin()">Cancel</button>
      <button class="success" onclick="verifyAdmin()">Login</button>
    </div>
  </div>
</div>

<!-- ADD BOOKING MODAL -->
<div id="addModal" class="modal-overlay">
  <div class="modal">
    <h3>Add Booking</h3>
    <label>Guest Name</label><input id="guest">
    <label>Phone (10 digits)</label><input id="phone">
    <label>No. of Guests (max 4)</label><input id="guests" type="number" min="1" max="4">
    <label>Room</label><select id="room"></select>
    <label>Check-in</label><input type="date" id="checkin">
    <label>Check-out</label><input type="date" id="checkout">
    <div class="modal-actions">
      <button class="warn" onclick="closeAdd()">Cancel</button>
      <button class="success" onclick="addBooking()">Confirm</button>
    </div>
  </div>
</div>

<!-- VIEW MODAL -->
<div id="viewModal" class="modal-overlay">
  <div class="modal">
    <h3>Booking Details</h3>
    <p><b>Guest:</b> <span id="vGuest"></span></p>
    <p><b>Phone:</b> <span id="vPhone"></span></p>
    <p><b>Guests:</b> <span id="vGuests"></span></p>
    <p><b>Room:</b> <span id="vRoom"></span></p>
    <p><b>Check-in:</b> <span id="vIn"></span></p>
    <p><b>Check-out:</b> <span id="vOut"></span></p>
    <div class="modal-actions">
      <button class="primary" onclick="closeView()">Close</button>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h3>Edit Booking</h3>
    <label>Guest Name</label><input id="eGuest">
    <label>Phone</label><input id="ePhone">
    <label>No. of Guests</label><input id="eGuests" type="number" min="1" max="4">
    <label>Check-in</label><input id="eIn" type="date">
    <label>Check-out</label><input id="eOut" type="date">
    <div class="modal-actions">
      <button class="warn" onclick="closeEdit()">Cancel</button>
      <button class="success" onclick="saveEdit()">Save</button>
    </div>
  </div>
</div>

<!-- INVOICE MODAL -->
<div id="invoiceModal" class="modal-overlay">
  <div class="modal">
    <h3>Invoice</h3>
    <p><b>Guest:</b> <span id="iGuest"></span></p>
    <p><b>Room:</b> <span id="iRoom"></span></p>
    <p><b>Nights:</b> <span id="iNights"></span></p>
    <label>Cost per night (₹)</label><input id="iRate" type="number">
    <label>Extra charges (₹)</label><input id="iExtra" type="number" value="0">
    <h3>Total: ₹ <span id="iTotal">0</span></h3>
    <div class="modal-actions">
      <button class="warn" onclick="closeInvoice()">Close</button>
      <button class="success" onclick="window.print()">Print</button>
    </div>
  </div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyNAx2Tuc3tn2pLg3OVBJ2Cu5iRPn7EnQ-QrscSUC1JQ9s6hgpTecJiZQuS4M3TYRCJ3g/exec";
const TOTAL_ROOMS=2;

let admin=false;
let allData=[];
let editData=null;
let invoiceData=null;

const $=id=>document.getElementById(id);
const dOnly=d=>new Date(d).toISOString().split("T")[0];

/* ADMIN */
$("adminLoginBtn").onclick=()=>{$("adminModal").classList.add("show")};
function closeAdmin(){$("adminModal").classList.remove("show")}
function verifyAdmin(){
  fetch(`${API_URL}?action=verifyAdmin&pin=${$("adminPin").value}`)
  .then(r=>r.json())
  .then(res=>{
    if(!res.success){$("adminError").textContent="Invalid PIN";return;}
    admin=true;
    $("adminLoginBtn").classList.add("hidden");
    $("addBookingBtn").classList.remove("hidden");
    closeAdmin();
    loadToday();
  });
}

/* INIT */
function initRooms(){
  for(let i=1;i<=TOTAL_ROOMS;i++)
    $("room").innerHTML+=`<option>${i}</option>`;
}

/* ADD */
$("addBookingBtn").onclick=()=>{$("addModal").classList.add("show")};
function closeAdd(){$("addModal").classList.remove("show")}

async function addBooking(){
  if(!/^\d{10}$/.test($("phone").value)) return alert("Invalid phone");
  if($("guests").value>4) return alert("Max 4 guests");

  const ci=$("checkin").value;
  const co=$("checkout").value;
  const rm=$("room").value;

  if(allData.some(b =>
    b.status==="Booked" &&
    b.room_no==rm &&
    ci<=dOnly(b.check_out) &&
    co>=dOnly(b.check_in)
  )) return alert("Room already booked");

  const fd=new URLSearchParams({
    action:"add",
    guest_name:$("guest").value,
    phone:$("phone").value,
    no_of_guests:$("guests").value,
    room_no:rm,
    check_in:ci,
    check_out:co
  });

  const res=await fetch(API_URL,{method:"POST",body:fd});
  const r=await res.json();
  if(!r.success) return alert(r.message);

  closeAdd();
  loadToday();
}

/* LOAD */
async function loadAvailability(date){
  allData=await fetch(API_URL).then(r=>r.json());
  $("list").innerHTML="";

  for(let i=1;i<=TOTAL_ROOMS;i++){
    const b=allData.find(x=>
      x.status==="Booked" &&
      x.room_no==i &&
      date>=dOnly(x.check_in) &&
      date<=dOnly(x.check_out)
    );

    let action="-";

    if(b){
      action=`<button class="primary" onclick="viewBooking('${b.booking_id}')">View</button>
              <button class="success" onclick="openInvoice('${b.booking_id}')">Invoice</button>`;

      if(admin){
        action+=`<button class="edit" onclick="editBooking('${b.booking_id}')">Edit</button>
                 <button class="warn" onclick="cancelBooking('${b.booking_id}')">Cancel</button>`;
      }
    }

    $("list").innerHTML+=`
    <tr>
      <td>Room ${i}</td>
      <td class="${b?'booked':'available'}">${b?'Booked':'Available'}</td>
      <td>${b?.guest_name||'-'}</td>
      <td>${action}</td>
    </tr>`;
  }
}
function loadToday(){loadAvailability(dOnly(new Date()))}

/* VIEW */
function viewBooking(id){
  const b=allData.find(x=>x.booking_id===id);
  $("vGuest").textContent=b.guest_name;
  $("vPhone").textContent=b.phone;
  $("vGuests").textContent=b.no_of_guests;
  $("vRoom").textContent="Room "+b.room_no;
  $("vIn").textContent=dOnly(b.check_in);
  $("vOut").textContent=dOnly(b.check_out);
  $("viewModal").classList.add("show");
}
function closeView(){$("viewModal").classList.remove("show")}

/* EDIT */
function editBooking(id){
  editData=allData.find(x=>x.booking_id===id);
  $("eGuest").value=editData.guest_name;
  $("ePhone").value=editData.phone;
  $("eGuests").value=editData.no_of_guests;
  $("eIn").value=dOnly(editData.check_in);
  $("eOut").value=dOnly(editData.check_out);
  $("editModal").classList.add("show");
}
function closeEdit(){$("editModal").classList.remove("show")}
function saveEdit(){
  const fd=new URLSearchParams({
    action:"update",
    booking_id:editData.booking_id,
    guest_name:$("eGuest").value,
    phone:$("ePhone").value,
    no_of_guests:$("eGuests").value,
    room_no:editData.room_no,
    check_in:$("eIn").value,
    check_out:$("eOut").value
  });
  fetch(API_URL,{method:"POST",body:fd}).then(()=>{closeEdit();loadToday();});
}

/* CANCEL */
function cancelBooking(id){
  if(!confirm("Cancel booking?"))return;
  fetch(API_URL,{method:"POST",body:new URLSearchParams({action:"cancel",booking_id:id})})
  .then(()=>loadToday());
}

/* INVOICE */
function openInvoice(id){
  invoiceData=allData.find(x=>x.booking_id===id);
  const nights=Math.max(1,(new Date(invoiceData.check_out)-new Date(invoiceData.check_in))/86400000);
  $("iGuest").textContent=invoiceData.guest_name;
  $("iRoom").textContent="Room "+invoiceData.room_no;
  $("iNights").textContent=nights;
  $("iRate").value="";
  $("iExtra").value=0;
  $("iTotal").textContent=0;
  $("invoiceModal").classList.add("show");

  $("iRate").oninput=$("iExtra").oninput=()=>{
    $("iTotal").textContent=
      (Number($("iRate").value||0)*nights)+Number($("iExtra").value||0);
  };
}
function closeInvoice(){$("invoiceModal").classList.remove("show")}

/* CALENDAR */
let calMonth=new Date().getMonth();
let calYear=new Date().getFullYear();

$("calendarBtn").onclick=()=>{
  $("calendarWrapper").classList.toggle("hidden");
  renderCalendar();
};

function changeMonth(step){
  calMonth+=step;
  if(calMonth<0){calMonth=11;calYear--}
  if(calMonth>11){calMonth=0;calYear++}
  renderCalendar();
}

async function renderCalendar(){
  $("calendar").innerHTML="";
  $("monthLabel").textContent=
    new Date(calYear,calMonth)
    .toLocaleString("default",{month:"long",year:"numeric"});

  const days=new Date(calYear,calMonth+1,0).getDate();

  for(let d=1;d<=days;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    let anyBooked=false;

    for(let r=1;r<=TOTAL_ROOMS;r++){
      const booked=allData.find(b=>
        b.status==="Booked" &&
        b.room_no==r &&
        dateStr>=dOnly(b.check_in) &&
        dateStr<=dOnly(b.check_out)
      );
      if(booked) anyBooked=true;
    }

    $("calendar").innerHTML+=`
    <div class="calendar-day ${anyBooked?'booked':'available'}">
      <div class="calendar-date">${d}</div>
      ${anyBooked?'❌ Booked':'✅ Available'}
    </div>`;
  }
}

/* START */
document.addEventListener("DOMContentLoaded",()=>{
  initRooms();
  loadToday();
});
</script>

</body>
</html>
